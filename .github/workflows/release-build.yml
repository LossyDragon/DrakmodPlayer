name: Rolling pre-release

# A versionCode bump on master builds a signed APK and replaces the single rolling
# pre-release (tag "pre-release"). Full releases are manual: see release.yml.
on:
  push:
    branches: [ master ]
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run if a newer push to the same ref comes in.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate: only proceed if :app versionCode actually changed in this push.
  # The path filter above already narrows this to commits that touch
  # app/build.gradle.kts; this job ensures the change is specifically the
  # versionCode bump and not something else in that file.
  # ---------------------------------------------------------------------------
  check-version:
    name: Check versionCode changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff versionCode
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"

          CURRENT=$(grep -E '^\s*versionCode\s*=' "$FILE" | head -n1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          echo "Current versionCode: $CURRENT"

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No previous commit — treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # fetch-depth: 2 covers most cases, but for pushes of >1 commit we
          # may need to fetch the before-SHA explicitly.
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE_SHA" 2>/dev/null || {
              echo "Could not fetch $BEFORE_SHA — treating as changed."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi

          PREVIOUS=$(git show "$BEFORE_SHA:$FILE" 2>/dev/null \
            | grep -E '^\s*versionCode\s*=' \
            | head -n1 \
            | sed -E 's/.*=\s*([0-9]+).*/\1/' || true)
          echo "Previous versionCode: ${PREVIOUS:-<none>}"

          if [[ "$CURRENT" != "$PREVIOUS" ]]; then
            echo "versionCode changed: ${PREVIOUS:-<none>} -> $CURRENT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "versionCode unchanged — skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    uses: ./.github/workflows/build-signed-apk.yml
    secrets: inherit

  publish:
    name: Publish rolling pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: pre-release
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # Delete and recreate so the tag moves to this commit and the release date is fresh.
      - name: Replace the pre-release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Pre-release $VERSION_NAME (build $VERSION_CODE)" \
            --notes "Rolling pre-release, replaced on every versionCode bump. Built from ${GITHUB_SHA::7}." \
            --generate-notes
